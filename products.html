<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Products — FRIDAH CREME BALES | Shoes & Clothings</title>
  <meta name="description" content="Browse our premium shoes and clothing collections. Quality, style and affordable prices." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/styles.css" />
  <script src="https://unpkg.com/lucide@0.244.0/dist/lucide.min.js"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
</head>
<body class="font-sans text-slate-800 bg-gradient-to-b from-white to-slate-50 antialiased">
  <div id="app" class="min-h-screen">
    <!-- Navigation -->
    <header class="sticky top-0 z-50 backdrop-blur-md bg-white/60 dark:bg-slate-900/60 border-b border-slate-200/40">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <a class="flex items-center gap-3" href="index.html" aria-label="FRIDAH CREME BALES">
            <div class="w-10 h-10 bg-gradient-to-tr from-rose-400 to-indigo-500 rounded-lg shadow-md flex items-center justify-center text-white font-semibold">FC</div>
            <div class="hidden sm:block">
              <div class="text-sm font-semibold">FRIDAH CREME BALES</div>
              <div class="text-xs text-slate-500">Shoes & Clothings — Muranga</div>
            </div>
          </a>

          <nav class="hidden md:flex items-center gap-6 text-sm">
            <a href="index.html" class="hover:text-slate-900">Home</a>
            <a href="products.html" class="hover:text-slate-900 font-semibold">Products</a>
            <a href="about.html" class="hover:text-slate-900">About</a>
            <a href="index.html#contact" class="hover:text-slate-900">Contact</a>
          </nav>

          <div class="flex items-center gap-3">
            <button id="cartBtn" class="relative p-2 rounded-md bg-white/80 hover:bg-white border border-slate-200 shadow-sm text-slate-700">
              <svg class="lucide" data-lucide="shopping-cart" width="20" height="20"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
              <span id="cartCount" class="absolute -top-2 -right-2 bg-rose-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="py-8">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- Header -->
        <div class="mb-8">
          <h1 class="text-4xl font-extrabold mb-2">Our Products</h1>
          <p class="text-slate-600">Curated collections of premium shoes and clothing.</p>
        </div>

        <!-- Filter Section -->
        <div class="space-y-4 mb-8">
          <div class="flex gap-2 flex-wrap">
            <button class="filter-btn active px-3 py-2 sm:px-4 sm:py-2 text-sm sm:text-base rounded-lg border-2 border-emerald-500 bg-emerald-500 text-white" data-category="all">All</button>
            <button class="filter-btn px-3 py-2 sm:px-4 sm:py-2 text-sm sm:text-base rounded-lg border-2 border-slate-200 hover:border-emerald-500" data-category="mens-shoes">Men's</button>
            <button class="filter-btn px-3 py-2 sm:px-4 sm:py-2 text-sm sm:text-base rounded-lg border-2 border-slate-200 hover:border-emerald-500" data-category="womens-shoes">Women's</button>
            <button class="filter-btn px-3 py-2 sm:px-4 sm:py-2 text-sm sm:text-base rounded-lg border-2 border-slate-200 hover:border-emerald-500" data-category="clothing">Clothing</button>
          </div>
          <select id="sortBy" class="w-full sm:w-auto px-4 py-2 border-2 border-slate-200 rounded-lg text-sm sm:text-base">
            <option value="featured">Featured</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
            <option value="newest">Newest</option>
          </select>
        </div>

        <!-- Products Grid -->
        <div id="productsGrid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6 mb-8">
          <!-- Products will be inserted here by JavaScript -->
        </div>
      </div>
    </main>
  </div>

  <!-- Shopping Cart Modal -->
  <div id="cartModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-end md:items-center justify-center p-4">
    <div class="bg-white rounded-t-2xl md:rounded-2xl shadow-lg max-w-2xl w-full max-h-[80vh] md:max-h-[90vh] flex flex-col">
      <div class="flex items-center justify-between p-4 sm:p-6 border-b border-slate-200">
        <h2 class="text-xl sm:text-2xl font-bold">Shopping Cart</h2>
        <button id="closeCart" class="text-2xl text-slate-400 hover:text-slate-600">×</button>
      </div>
      
      <div id="cartItems" class="flex-1 overflow-y-auto p-4 sm:p-6">
        <p class="text-slate-500 text-center py-8">Your cart is empty</p>
      </div>
      
      <div class="border-t border-slate-200 p-4 sm:p-6 space-y-3 sm:space-y-4">
        <div class="flex justify-between text-base sm:text-lg font-semibold">
          <span>Total:</span>
          <span>KSh. <span id="cartTotal">0</span></span>
        </div>
        <button id="checkoutBtn" class="w-full px-6 py-3 btn-primary rounded-lg font-semibold text-white text-base">Proceed to Checkout</button>
        <button id="continueShopping" class="w-full px-6 py-3 border-2 border-slate-200 rounded-lg font-semibold hover:bg-slate-50 text-sm sm:text-base">Continue Shopping</button>
      </div>
    </div>
  </div>

  <script>
    // Products Database
    const products = [
      { id: 1, name: 'Classic Men\'s Leather Shoes', category: 'mens-shoes', price: 2500, image: 'images/image 1.jpeg', description: 'Premium leather shoes perfect for casual and formal occasions.' },
      { id: 2, name: 'Sports Running Shoes', category: 'mens-shoes', price: 1800, image: 'images/image 2.jpeg', description: 'Comfortable and durable running shoes for everyday wear.' },
      { id: 3, name: 'Designer Men\'s Loafers', category: 'mens-shoes', price: 3200, image: 'images/image 3.jpeg', description: 'Stylish loafers for professional and casual settings.' },
      { id: 4, name: 'Women\'s Sneakers', category: 'womens-shoes', price: 1500, image: 'images/image 1.jpeg', description: 'Trendy and comfortable sneakers for women.' },
      { id: 5, name: 'Women\'s Casual Flats', category: 'womens-shoes', price: 1200, image: 'images/image 2.jpeg', description: 'Elegant flats perfect for everyday wear.' },
      { id: 6, name: 'Premium Men\'s Polo', category: 'clothing', price: 1200, image: 'images/image 3.jpeg', description: 'High-quality polo shirt in multiple colors.' },
      { id: 7, name: 'Women\'s Casual T-Shirt', category: 'clothing', price: 800, image: 'images/image 1.jpeg', description: 'Comfortable and stylish t-shirt.' },
      { id: 8, name: 'Formal Dress Shirt', category: 'clothing', price: 1500, image: 'images/image 2.jpeg', description: 'Classic formal shirt for professional wear.' },
      { id: 9, name: 'Denim Jeans', category: 'clothing', price: 2000, image: 'images/image 3.jpeg', description: 'Quality denim jeans with modern fit.' },
      { id: 10, name: 'Women\'s Sundress', category: 'clothing', price: 1800, image: 'images/image 1.jpeg', description: 'Beautiful sundress perfect for warm weather.' },
    ];

    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let filteredProducts = products;

    // Initialize AOS
    if(window.AOS) AOS.init({duration:600,once:true});
    if(window.lucide) lucide.init();

    // Render products
    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = filteredProducts.map(product => `
        <div class="bg-white rounded-lg shadow hover:shadow-lg transition overflow-hidden" data-aos="fade-up">
          <img src="${product.image}" alt="${product.name}" class="w-full h-40 object-cover">
          <div class="p-4">
            <h3 class="font-semibold text-slate-900 line-clamp-2">${product.name}</h3>
            <p class="text-sm text-slate-600 mt-1 line-clamp-2">${product.description}</p>
            <div class="flex items-center justify-between mt-4">
              <span class="text-lg font-bold text-emerald-600">KSh. ${product.price}</span>
              <button class="add-to-cart px-3 py-2 bg-emerald-500 text-white rounded hover:bg-emerald-600 transition text-sm font-semibold" data-id="${product.id}">Add</button>
            </div>
          </div>
        </div>
      `).join('');
      
      // Attach click handlers
      document.querySelectorAll('.add-to-cart').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const productId = parseInt(e.target.dataset.id);
          addToCart(productId);
        });
      });
    }

    // Filter functionality
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.classList.remove('border-emerald-500', 'bg-emerald-500', 'text-white');
          b.classList.add('border-slate-200');
        });
        e.target.classList.add('border-emerald-500', 'bg-emerald-500', 'text-white');
        e.target.classList.remove('border-slate-200');
        
        const category = e.target.dataset.category;
        filteredProducts = category === 'all' ? products : products.filter(p => p.category === category);
        renderProducts();
      });
    });

    // Sort functionality
    document.getElementById('sortBy').addEventListener('change', (e) => {
      const sortBy = e.target.value;
      filteredProducts.sort((a, b) => {
        if(sortBy === 'price-low') return a.price - b.price;
        if(sortBy === 'price-high') return b.price - a.price;
        if(sortBy === 'newest') return b.id - a.id;
        return 0;
      });
      renderProducts();
    });

    // Cart functions
    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      const existingItem = cart.find(item => item.id === productId);
      
      if(existingItem) {
        existingItem.quantity += 1;
      } else {
        cart.push({...product, quantity: 1});
      }
      
      saveCart();
      updateCartUI();
      showCartNotification();
    }

    function removeFromCart(productId) {
      cart = cart.filter(item => item.id !== productId);
      saveCart();
      updateCartUI();
    }

    function updateQuantity(productId, quantity) {
      const item = cart.find(item => item.id === productId);
      if(item) item.quantity = Math.max(1, quantity);
      saveCart();
      updateCartUI();
    }

    function saveCart() {
      localStorage.setItem('cart', JSON.stringify(cart));
    }

    function updateCartUI() {
      const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);
      document.getElementById('cartCount').textContent = cartCount;
      
      const cartItemsDiv = document.getElementById('cartItems');
      if(cart.length === 0) {
        cartItemsDiv.innerHTML = '<p class="text-slate-500 text-center py-8">Your cart is empty</p>';
      } else {
        cartItemsDiv.innerHTML = cart.map(item => `
          <div class="flex gap-4 pb-4 border-b border-slate-200 last:border-b-0">
            <img src="${item.image}" alt="${item.name}" class="w-16 h-16 object-cover rounded">
            <div class="flex-1">
              <h3 class="font-semibold text-sm">${item.name}</h3>
              <p class="text-slate-600 text-sm">KSh. ${item.price}</p>
            </div>
            <div class="flex items-center gap-2">
              <button class="px-2 py-1 border rounded hover:bg-slate-50" onclick="updateQuantity(${item.id}, ${item.quantity - 1})">−</button>
              <span class="w-8 text-center">${item.quantity}</span>
              <button class="px-2 py-1 border rounded hover:bg-slate-50" onclick="updateQuantity(${item.id}, ${item.quantity + 1})">+</button>
              <button class="ml-2 text-red-500 hover:text-red-700" onclick="removeFromCart(${item.id})">✕</button>
            </div>
            <div class="text-right">
              <p class="font-semibold">KSh. ${item.price * item.quantity}</p>
            </div>
          </div>
        `).join('');
      }
      
      const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      document.getElementById('cartTotal').textContent = total;
    }

    function showCartNotification() {
      alert('Item added to cart!');
    }

    // Cart modal
    document.getElementById('cartBtn').addEventListener('click', () => {
      document.getElementById('cartModal').classList.remove('hidden');
    });

    document.getElementById('closeCart').addEventListener('click', () => {
      document.getElementById('cartModal').classList.add('hidden');
    });

    document.getElementById('continueShopping').addEventListener('click', () => {
      document.getElementById('cartModal').classList.add('hidden');
    });

    document.getElementById('checkoutBtn').addEventListener('click', () => {
      if(cart.length === 0) {
        alert('Your cart is empty');
        return;
      }
      window.location.href = 'checkout.html';
    });

    // Initialize
    renderProducts();
  </script>
</body>
</html>
